# Supabase met en pause les projets gratuits après 7 jours sans activité.
# Ce workflow appelle la base tous les 3 jours pour la garder éveillée.
# Il lit l'adresse et la clé publique directement dans index.html.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appeler la base
        run: |
          URL=$(grep -oP "const SUPABASE_URL = '\K[^']+" index.html)
          KEY=$(grep -oP "const SUPABASE_KEY = '\K[^']+" index.html)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase pas encore configuré"; exit 0; fi
          AUTH=()
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY");; esac
          curl --fail --silent --show-error -X POST "${URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}'
